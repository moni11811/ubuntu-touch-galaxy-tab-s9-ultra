[Service]
# The halium initramfs leaves its debug gadget (g1, 18d1:d001) bound to the
# UDC with a dead adbd behind it. usb-moded then cannot rewrite idVendor
# (EINVAL while bound) nor rebind the UDC, and falls back to charging_only
# (18d1:0afe), leaving the host with a broken enumeration. Unbind the stale
# gadget before usb-moded starts so it can configure g1 from scratch.
ExecStartPre=-/bin/sh -c 'g=/sys/kernel/config/usb_gadget/g1; [ -d "$g" ] && { echo "" > "$g"/UDC 2>/dev/null; for l in "$g"/configs/c.1/*; do [ -L "$l" ] && rm -f "$l"; done; }; true'
